<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOHYAMA Portfolio Promo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050814;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      width: min(100vw, 1280px);
      padding: 16px;
      box-sizing: border-box;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      background: #000;
    }
  </style>
</head>
<body>
  <main>
    <video controls autoplay muted playsinline poster="">
      <source src="./promo.mp4" type="video/mp4">
      お使いのブラウザでは動画を再生できません。
    </video>
  </main>
</body>
</html>
